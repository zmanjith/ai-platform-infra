apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/zmanjith/ai-platform-infra.git
    targetRevision: feature1
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
