
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-app
  namespace: ai-platform-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-platform-app
  template:
    metadata:
      labels:
        app: ai-platform-app
    spec:
      containers:
        - name: ai-platform-app
          image: 491377098012.dkr.ecr.ap-southeast-2.amazonaws.com/ai-platform-app:a8b3f108479de8d6ebf2f4ed734d1774b656cdcc
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
